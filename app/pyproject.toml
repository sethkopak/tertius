[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tertius"
version = "0.1.0"
description = "Tertius - local, offline batch audio/video transcription with faster-whisper and a Flask queue UI"
# No `readme`, and no `license = {file = ...}`: README.md and LICENSE both sit
# at the top of the folder next to the launchers, where a user will actually
# find them, and setuptools will not read a file from outside the project
# directory. The classifier below carries the licence instead.
classifiers = ["License :: OSI Approved :: MIT License"]
# 3.11 because that is the floor CI actually exercises (3.11 / 3.13, plus 3.14
# on Windows). This said >=3.9 while nothing had ever been run on 3.9 or 3.10 -
# a promise to pip that no test backed.
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The CUDA runtime libraries CTranslate2 needs to actually use an NVIDIA GPU.
# About 1.2 GB, and deliberately not a base dependency: most machines do not
# have a CUDA GPU, and a Mac never can. The markers keep pip from even trying
# on macOS, where these wheels do not exist.
gpu = [
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12; platform_system != 'Darwin'",
]
# Translation. `transformers` and `sentencepiece` tokenize at run time and are
# small; `torch` is neither, and is needed only to *convert* a model the first
# time one is used. They are one extra rather than two because a machine that
# can translate is a machine that had to convert first - splitting them would
# only offer an install that downloads a model and then cannot use it.
translate = [
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "torch>=2.2",
]
# Reading text aloud. `torch` here is not a setup-only dependency the way it is
# for translating - it is the runtime, and it runs the model on every chunk.
#
# The two extras therefore want *different builds of the same package*, and one
# virtual environment holds one torch. `translate` deliberately takes the
# CPU-only wheel, because conversion never runs a model and the CUDA build is
# ten times the download; speaking on that wheel works and is perhaps twenty
# times slower. Whichever is installed first wins, so `tertius.speech`
# checks for exactly that case and says so rather than letting someone sit
# through a CPU synthesis wondering why the GPU is idle. Installing this extra
# through pip does not choose an index; the Download and prepare button does.
# `chatterbox-tts` is absent on purpose, and this extra cannot install it.
# Its metadata hard-pins `spacy-pkuseg` (no cp314 wheel anywhere, so pip tries
# to compile it and needs MSVC), `transformers==5.2.0` (which would downgrade
# the library translation depends on) and `gradio==6.8.0` (never imported).
# pip has no way to say "this package without its declared dependencies" from
# a dependency list, so the Download and prepare button does it with
# `--no-deps` plus the real imports - see CHATTERBOX_DEPENDENCIES in
# tertius/speech.py. Installing this extra gets the rest ready.
speak = [
    "torch>=2.2",
    # Spells digits out before the voice model has to read them; it can only
    # manage them in English. LGPL-2.1, which binds the library rather than
    # what imports it.
    "num2words",
    "librosa",
    "resemble-perth",
    "s3tokenizer",
    "conformer",
    "diffusers",
    "omegaconf",
    "pyloudnorm",
    "pykakasi",
    "transformers>=4.40",
    "safetensors",
]

[project.scripts]
tertius = "tertius.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `data/*.json` is the Wikidata book-name table. Without it every scripture
# citation silently stays in English in every language, which is not an error
# anything reports - so it must not be left out of the wheel.
tertius = ["templates/*.html", "static/*", "static/fonts/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from this folder with nothing installed and no PYTHONPATH
# set - which is what CI does on all three platforms.
pythonpath = ["src"]
