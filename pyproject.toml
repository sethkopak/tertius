[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tertius"
version = "0.1.0"
description = "Tertius - local, offline batch audio/video transcription with faster-whisper and a Flask queue UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tertius = "tertius.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tertius = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
